; Еталон 1.3 — поліцейська мигалка.
; Два варіанти в одному проєкті, перемикаються середовищем:
;   pio run -e two_pins -t upload   — базове завдання (+ третій LED, зміна швидкості)
;   pio run -e one_pin  -t upload   — бонус: два LED на одному GPIO

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:two_pins]
build_src_filter = +<two_pins.cpp>

[env:one_pin]
build_src_filter = +<one_pin.cpp>
