; Практика 6.7 - Heap, динамічне виділення памʼяті, оптимізація ресурсів (ESP-IDF, ESP32-S3).
; Кожен крок - окремий файл src/stepN_*.c і окреме середовище [env:stepN].
; ESP-IDF у PlatformIO не підтримує build_src_filter, тому файл кроку вибирає
; src/CMakeLists.txt за назвою середовища. Додаткові опції sdkconfig для кроку
; (sdkconfig.stepN.defaults, якщо такий файл є) підхоплює кореневий CMakeLists.txt.
;
;   pio run -e step1 -t upload -t monitor

[platformio]
default_envs = step1 ; `pio run -t upload` без -e прошиває лише цей крок

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Крок 1: моніторинг на старті - free heap, найбільший блок, мінімум, High Water Mark стеку
[env:step1]

; Крок 2: xTaskCreate() проти xTaskCreateStatic() при штучній нестачі heap (HUGE_STATIC_STACK у файлі)
[env:step2]

; Крок 3: різнорозмірні heap_caps_malloc()/heap_caps_free() - розрив між free і largest росте
[env:step3]

; Крок 4: malloc(25 КБ) повертає NULL при 100+ КБ вільних, спрацьовує failed-alloc callback
[env:step4]

; Крок 5: antipattern malloc/free у циклі задачі проти одного виділення на старті (ALLOC_ONCE у файлі)
[env:step5]

; Крок 6: malloc() / pvPortMalloc() / heap_caps_malloc() з INTERNAL / SPIRAM / DMA (PSRAM: sdkconfig.step6.defaults)
[env:step6]

; Крок 7 (доповнено): підбір стеку за High Water Mark і переповнення стеку (STACK_OVERFLOW у файлі)
[env:step7]

; Крок 8 (доповнено): Memory Pool - блоки фіксованого розміру, heap після старту не змінюється
[env:step8]
