; Урок 1.6 — практика: АЦП і фоторезистор.
; Кожен крок — окреме середовище. Заливати так:
;   pio run -e step1 -t upload && pio device monitor
; У VS Code: нижня панель PlatformIO → вибрати env:stepN → Upload and Monitor.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:step1]
build_src_filter = +<step1_raw.cpp>

[env:step2]
build_src_filter = +<step2_volts.cpp>

[env:step3]
build_src_filter = +<step3_smart_light.cpp>

[env:step4]
build_src_filter = +<step4_flicker.cpp>

[env:step5]
build_src_filter = +<step5_moving_average.cpp>

[env:step6]
build_src_filter = +<step6_hysteresis.cpp>
