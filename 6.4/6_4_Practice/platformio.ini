; Практика 6.4 - кінцеві автомати (FSM) на ESP-IDF: турнікет у метро.
; Кожен крок - окремий файл src/stepN_*.c і окреме середовище [env:stepN].
; ESP-IDF у PlatformIO не підтримує build_src_filter, тому файл кроку вибирає
; src/CMakeLists.txt за назвою середовища.
;
;   pio run -e step1 -t upload -t monitor
;
; Монітор - через порт «UART» плати (USB-UART міст), а не «USB»: саме туди йде консоль
; ESP-IDF, і з неї задача console читає натиснуті клавіші.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Крок 1: два стани, дві події, switch-case
;[env:step1]

; Крок 2: третій стан, таймаут стану, дії входу (LED), внутрішні переходи
;[env:step2]

; Крок 3: та сама поведінка, що в кроці 2, але таблицею переходів
[env:step3]


