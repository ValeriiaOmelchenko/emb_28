; Практика 6.3 (спрощена) - FreeRTOS: черги.
; Кожен крок - окремий файл src/stepN_*.c і окреме середовище [env:stepN].
; ESP-IDF у PlatformIO не підтримує build_src_filter, тому файл кроку вибирає
; src/CMakeLists.txt за назвою середовища.
;
;   pio run -e step1 -t upload -t monitor

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Гонка: s_counter++ з двох ядер, volatile не рятує
[env:step1]

; Той самий лічильник через чергу: один власник, без гонки
[env:step2]

; ISR кнопки BOOT -> черга -> задача, антибрязкіт через вимкнення переривання
[env:step3]
