; Практика 6.3 - FreeRTOS: черги.
; Крок 1: гонка на спільному лічильнику (дві задачі на двох ядрах).
; Крок 2: та сама задача через xQueue + подія з ISR кнопки BOOT.
; Кожен крок - окремий файл src/stepN_*.c і окреме середовище [env:stepN].
; ESP-IDF у PlatformIO не підтримує build_src_filter, тому файл кроку вибирає
; src/CMakeLists.txt за назвою середовища.
;
;   pio run -e step1 -t upload -t monitor
;   pio run -e step2 -t upload -t monitor

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Гонка: shared_counter++ з двох ядер, volatile не рятує
;[env:step1]

; Виправлення: один власник лічильника (consumer), дані - через чергу; ISR -> черга
[env:step2]
