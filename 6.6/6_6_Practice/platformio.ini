; Практика 6.6 - енергозбереження: Active, Light Sleep, Deep Sleep, джерела пробудження (ESP-IDF, ESP32-S3).
; Кожен крок - окремий файл src/stepN_*.c і окреме середовище [env:stepN].
; ESP-IDF у PlatformIO не підтримує build_src_filter, тому файл кроку вибирає
; src/CMakeLists.txt за назвою середовища.
;
;   pio run -e step1 -t upload -t monitor

[platformio]
default_envs = step6 ; `pio run -t upload` без -e прошиває лише цей крок

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Крок 1: Active - обидва ядра зайняті роботою (BUSY_CORES у файлі)
[env:step1]

; Крок 2: Light Sleep вручну - таймер + кнопка, локальні змінні задачі живі
[env:step2]

; Крок 3: Deep Sleep - RTC_DATA_ATTR переживає сон, звичайна змінна ні
[env:step3]

; Крок 4: Deep Sleep з двома джерелами пробудження: EXT0 (кнопка) + таймер
[env:step4]

; Крок 5: розгалуження за причиною пробудження
[env:step5]

; Крок 6: автоматичний light sleep (PM + tickless idle): busy-wait проти vTaskDelay (BUSY_WAIT у файлі)
[env:step6]
