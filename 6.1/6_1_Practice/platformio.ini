; Практика 6.1 - FreeRTOS на ESP-IDF: задача 2.3 (три незалежні LED) з суперлупу на задачі.
; Кожен крок - окремий файл src/stepN_*.c і окреме середовище [env:stepN].
; ESP-IDF у PlatformIO не підтримує build_src_filter, тому файл кроку вибирає
; src/CMakeLists.txt за назвою середовища.
;
;   pio run -e step1 -t upload -t monitor

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Підтема 2: перша задача (xTaskCreate) і стани Running / Ready / Blocked / Suspended
;[env:step1]

; Підтема 3: три LED з 2.3 на трьох задачах (xTaskCreate + vTaskDelay)
;[env:step2]

; Підтема 3: дрейф vTaskDelay проти стабільності xTaskDelayUntil
[env:step3]