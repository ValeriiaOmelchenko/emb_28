; Урок 2.1 - практика (Arduino): пам'ять, volatile, atomic, кнопка BOOT.
; Жодної зовнішньої периферії: лише плата ESP32-S3-DevKitC-1 і її кнопка BOOT (GPIO 0).
; Кожен крок - окреме середовище. Заливати так:
;   pio run -e step1 -t upload && pio device monitor
; У VS Code: нижня панель PlatformIO → вибрати env:stepN → Upload and Monitor.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

[env:step1]
build_src_filter = +<step1_memory.cpp>

[env:step2]
build_src_filter = +<step2_volatile.cpp>

[env:step3]
build_src_filter = +<step3_isr_bounce.cpp>

[env:step4]
build_src_filter = +<step4_volatile_not_atomic.cpp>

[env:step5]
build_src_filter = +<step5_torn_read.cpp>

[env:step6]
build_src_filter = +<step6_boot_event.cpp>
