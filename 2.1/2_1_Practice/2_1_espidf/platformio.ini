; Урок 2.1 - практика (ESP-IDF): пам'ять, volatile, atomic, кнопка BOOT.
; Жодної зовнішньої периферії: лише плата ESP32-S3-DevKitC-1 і її кнопка BOOT (GPIO 0).
;
; ESP-IDF у PlatformIO не підтримує build_src_filter, тому всі файли кроків компілюються
; завжди, а кожен файл обгорнуто в #if PRACTICE_STEP == N. Номер кроку задає build_src_flags.
;
; Заливати так:
;   pio run -e step1 -t upload && pio device monitor
; У VS Code: нижня панель PlatformIO → вибрати env:stepN → Upload and Monitor.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

[env:step1]
build_src_flags = -DPRACTICE_STEP=1

[env:step2]
build_src_flags = -DPRACTICE_STEP=2

[env:step3]
build_src_flags = -DPRACTICE_STEP=3

[env:step4]
build_src_flags = -DPRACTICE_STEP=4

[env:step5]
build_src_flags = -DPRACTICE_STEP=5

[env:step6]
build_src_flags = -DPRACTICE_STEP=6
