; Практика 6.5 - Race Condition, Mutex, Deadlock, семафори, Priority Inversion (ESP-IDF, ESP32-S3).
; Кожен крок - окремий файл src/stepN_*.c і окреме середовище [env:stepN].
; ESP-IDF у PlatformIO не підтримує build_src_filter, тому файл кроку вибирає
; src/CMakeLists.txt за назвою середовища.
;
;   pio run -e step1 -t upload -t monitor

[platformio]
default_envs = step1 ; `pio run -t upload` без -e прошиває лише цей крок

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

; Крок 1: Race Condition - лічильник на двох ядрах губить інкременти
[env:step1]

; Крок 2: той самий лічильник під mutex; коротка і довга критична секція
[env:step2]

; Крок 3: Deadlock на двох mutex і два способи його прибрати (DEADLOCK_MODE у файлі)
[env:step3]

; Крок 4: бінарний семафор ISR -> задача, кнопка BOOT (USE_PORT_YIELD у файлі)
[env:step4]

; Крок 5: лічильний семафор - пул з 2 буферів на 4 задачі
[env:step5]

; Крок 6: Priority Inversion - бінарний семафор проти mutex з успадкуванням пріоритету
[env:step6]

; Крок 7: task notification ISR -> задача замість бінарного семафора, кнопка BOOT
[env:step7]
