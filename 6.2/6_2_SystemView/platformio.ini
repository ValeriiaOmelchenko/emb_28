; 6.2 - FreeRTOS задачі та планувальник під SEGGER SystemView.
; Трасування йде через вбудований USB-JTAG ESP32-S3 (порт "USB" на DevKitC-1),
; один кабель: прошивка, монітор і JTAG працюють через той самий порт.
;
;   pio run -t upload            прошити
;   pio run -t sysview           записати trace.SVDat (обидва ядра, 10 с)
;   pio device monitor           лог (можна паралельно з трасуванням)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

debug_tool = esp-builtin
extra_scripts = sysview_target.py

; Тривалість запису трасування, секунд.
custom_sysview_seconds = 10

; OpenOCD, який рекомендує ESP-IDF 5.5.3 (tools/tools.json). Вбудований у
; PlatformIO OpenOCD 2022 року для SystemView з ESP-IDF 5.5 не підходить.
custom_sysview_openocd = ~/.espressif/tools/openocd-esp32/v0.12.0-esp32-20251215/openocd-esp32
