; Урок 2.3 - практика (Arduino): superloop, polling, неблокуючий таймінг з millis().
; Залізо: ESP32-S3-DevKitC-1, 3 LED з резисторами (GPIO 4, 5, 6), кнопка на GPIO 7 → GND.
; Заливати: pio run -t upload && pio device monitor

[env:esp32-s3-devkitc-1]
