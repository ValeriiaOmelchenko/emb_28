; Еталон 2.3 - три незалежні LED у superloop без delay() (процедурно, без ООП):
; таблиця struct Blinker, таймінг через millis() з фіксованою сіткою часу,
; контрольний звіт у Serial раз на 10 с.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
